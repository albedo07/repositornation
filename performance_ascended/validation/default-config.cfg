[Benchmark]

## Wait for building discovery and first shadow application before an ON capture. Set false only to investigate startup/loading deliberately.
# Setting type: Boolean
# Default value: true
Require Ready For ON Capture = true

## Capture memory, process CPU and feature coverage once per second while recording. Adds diagnostic overhead to both ON and OFF captures.
# Setting type: Boolean
# Default value: true
Detailed Diagnostics = true

## Request optional Unity rendering, main/render thread and allocation counters during recordings. Unavailable counters are reported as -1. Does not enable deep profiling.
# Setting type: Boolean
# Default value: true
Rendering Counters = true

## Optional short label for the scene being tested, for example base_walk or first_skill_cast. Use the same label for comparable runs.
# Setting type: String
# Default value: unlabeled
Scenario = unlabeled

## Frames at or above this duration are also exported to the spikes CSV.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 16 to 1000
Spike Threshold Milliseconds = 50

## During a recording, mark an action or slowdown. Default Left Ctrl + Left Alt + F9; markers are numbered in order.
# Setting type: KeyboardShortcut
# Default value: F9 + LeftControl + LeftAlt
Marker Hotkey = F9 + LeftControl + LeftAlt

## Automatic benchmark duration. A second hotkey press ends it early.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 10 to 180
Duration Seconds = 60

## Start/stop a benchmark. Default: Left Ctrl + Left Alt + F10.
# Setting type: KeyboardShortcut
# Default value: F10 + LeftControl + LeftAlt
Record Hotkey = F10 + LeftControl + LeftAlt

[Cosmetics]

## Limit particle counts on exact allowlisted cosmetic effects. Unknown effects are unchanged.
# Setting type: Boolean
# Default value: true
Death Particle Budget = true

## Maximum particles per tracked cosmetic system; shared budget can lower this further.
# Setting type: Int32
# Default value: 96
# Acceptable value range: From 8 to 512
Particles Per System = 96

## Total maximum-particle capacity shared among up to 256 tracked cosmetic systems. A minimum of one slot is retained per system.
# Setting type: Int32
# Default value: 1024
# Acceptable value range: From 256 to 8192
Shared Particle Budget = 1024

## Beyond this distance the allocated cosmetic particle cap is halved.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 150
Far Distance = 30

## Comma-separated exact root prefab names, ignoring (Clone). Only pure cosmetic particle systems are eligible. Add reviewed modded cosmetic effects here; skill telegraphs should remain excluded.
# Setting type: String
# Default value: vfx_greydwarf_death,vfx_greydwarf_shaman_death,vfx_greydwarf_elite_death,vfx_skeleton_death,vfx_troll_death,vfx_draugr_death
Exact Effect Names = vfx_greydwarf_death,vfx_greydwarf_shaman_death,vfx_greydwarf_elite_death,vfx_skeleton_death,vfx_troll_death,vfx_draugr_death

[General]

## Internal one-time migration marker for old discovery and screenshot-conflicting defaults.
# Setting type: Int32
# Default value: 0
Config Revision = 1

## Enable optimization features. Turning off restores owned instance properties. Benchmarks remain available.
# Setting type: Boolean
# Default value: true
Enabled = true

## Toggle optimization features. Default: Left Ctrl + Left Alt + F6. Wait for settings to settle before recording.
# Setting type: KeyboardShortcut
# Default value: F6 + LeftControl + LeftAlt
Toggle Hotkey = F6 + LeftControl + LeftAlt

[HUD]

## Show a persistent ON/OFF status while in a world.
# Setting type: Boolean
# Default value: true
Show Optimization Indicator = true

## Indicator horizontal position in screen pixels from the left.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 8192
Indicator X = 12

## Indicator vertical position in screen pixels from the top.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 8192
Indicator Y = 12

[Structures]

## Use ordered constant-time callback removal for native terrain support-cache notifications. Preserves clearing, callback order and native object lifetime. Turning OFF restores native subscriptions.
# Setting type: Boolean
# Default value: true
Efficient Support Cache Subscriptions = true

## Disable all Unity real-time shadows while optimization is ON. Skips building discovery and shadow application. Turning OFF restores the previous quality setting unless another writer changed it. Set false to use the previous distant-building shadow mode.
# Setting type: Boolean
# Default value: true
Disable All Shadows = true

## Soft per-frame discovery time budget. A single hierarchy cannot be interrupted. Slow frames halve this budget.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,1 to 2
Discovery Time Budget Milliseconds = 0.5

## Soft per-frame shadow update time limit, in addition to Renderer Budget. Slow frames halve this budget. One engine operation can exceed it.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,1 to 2
Shadow Time Budget Milliseconds = 0.5

## Remove shadows cast by distant building MeshRenderers. Buildings remain visible and interactive.
# Setting type: Boolean
# Default value: true
Distant Shadows = true

## Distance in metres beyond which building pieces stop casting shadows.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 10 to 250
Shadow Distance = 40

## Move this much closer before restoring shadows, preventing boundary flicker.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 20
Shadow Hysteresis = 5

## Maximum registry entries examined per frame, also constrained by the discovery time budget.
# Setting type: Int32
# Default value: 256
# Acceptable value range: From 1 to 512
Discovery Budget = 256

## Maximum building renderers checked per frame. Large builds take longer to refresh.
# Setting type: Int32
# Default value: 128
# Acceptable value range: From 16 to 1024
Renderer Budget = 128

